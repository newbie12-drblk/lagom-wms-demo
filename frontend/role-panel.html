<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chọn vai trò - LAGOM</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/role-panel.css" />
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="app-shell">
      <div class="role-panel">
        <h1>🧪 LAGOM Pharma</h1>
        <p class="sub" id="greetingText">Chọn vai trò để tiếp tục</p>

        <div class="role-grid" id="roleGrid">
          <!-- Admin -->
          <a href="admin.html" class="role-card" data-role="admin">
            <span class="icon">👑</span>
            <div class="name">Quản trị</div>
            <div class="desc">Quản lý người dùng, duyệt yêu cầu</div>
            <span class="badge badge-admin">Admin</span>
          </a>

          <!-- Nhập liệu -->
          <a href="index.html" class="role-card" data-role="nhap_lieu">
            <span class="icon">📝</span>
            <div class="name">Nhập liệu</div>
            <div class="desc">Tạo phiếu nhập, phiếu xuất, xem kho</div>
            <span class="badge badge-nhap-lieu">Nhập liệu</span>
          </a>

          <!-- Quản lý -->
          <a href="manager.html" class="role-card" data-role="quan_ly">
            <span class="icon">📋</span>
            <div class="name">Quản lý</div>
            <div class="desc">Duyệt yêu cầu từ Admin</div>
            <span class="badge badge-quan-ly">Quản lý</span>
          </a>

          <!-- Xem kho (Nhân viên) -->
          <a href="index.html" class="role-card" data-role="nhan_vien">
            <span class="icon">📊</span>
            <div class="name">Xem kho</div>
            <div class="desc">Xem tồn kho, phiếu nhập/xuất</div>
            <span class="badge badge-nhan-vien">Nhân viên</span>
          </a>
        </div>

        <button class="logout-link" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>

        <div class="footer">v2.0.0 · LAGOM WMS</div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      function handleLogout() {
        if (confirm("Bạn có chắc muốn đăng xuất?")) {
          Auth.logout();
          window.location.href = "login.html";
        }
      }

      // Kiểm tra nếu chưa đăng nhập thì redirect về login
      if (!Auth.isLoggedIn()) {
        window.location.href = "login.html";
      }

      // Cập nhật tên user
      const user = Auth.getCurrentUser();
      if (user) {
        document.getElementById("greetingText").textContent =
          `Xin chào ${user.fullName || user.username}! Chọn vai trò để tiếp tục.`;
      }

      // Lọc các role không có quyền
      const currentRole = Auth.getCurrentRole();
      const roleGrid = document.getElementById("roleGrid");
      const roleCards = roleGrid.querySelectorAll(".role-card");

      roleCards.forEach((card) => {
        const cardRole = card.dataset.role;

        // Nếu là admin thì hiện tất cả
        if (currentRole === "admin") {
          card.style.display = "block";
          return;
        }

        // Nếu là nhập liệu: chỉ hiện Nhập liệu và Xem kho
        if (currentRole === "nhap_lieu") {
          if (cardRole === "admin" || cardRole === "quan_ly") {
            card.style.display = "none";
          } else {
            card.style.display = "block";
          }
          return;
        }

        // Nếu là quản lý: chỉ hiện Quản lý và Xem kho
        if (currentRole === "quan_ly") {
          if (cardRole === "admin" || cardRole === "nhap_lieu") {
            card.style.display = "none";
          } else {
            card.style.display = "block";
          }
          return;
        }

        // Mặc định: chỉ hiện Xem kho
        if (cardRole !== "nhan_vien") {
          card.style.display = "none";
        } else {
          card.style.display = "block";
        }
      });
    </script>
  </body>
</html>
