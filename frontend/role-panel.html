<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chọn vai trò - LAGOM</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/role-panel.css" />
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="app-shell">
      <div class="role-panel">
        <div class="role-header">
          <div class="role-logo">
            <div class="role-logo-icon">🧪</div>
            <h1>LAGOM Pharma</h1>
          </div>
          <p class="sub" id="greetingText">Chọn vai trò để tiếp tục</p>
        </div>

        <div class="role-grid" id="roleGrid">
          <!-- Quản lý -->
          <a href="manager.html" class="role-card" data-role="quan_ly">
            <div class="role-card-icon">📋</div>
            <div class="role-card-name">Quản lý</div>
            <div class="role-card-desc">Duyệt yêu cầu từ Admin</div>
          </a>

          <!-- Xem kho (Nhân viên) -->
          <a href="index.html" class="role-card" data-role="nhan_vien">
            <div class="role-card-icon">📊</div>
            <div class="role-card-name">Xem kho</div>
            <div class="role-card-desc">Xem tồn kho, phiếu nhập/xuất</div>
          </a>
        </div>

        <button class="logout-link" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>

        <div class="role-footer">v2.0.0 · LAGOM WMS</div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-panel.js"></script>
  </body>
</html>
